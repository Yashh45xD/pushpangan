<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f4f2ea"/>
  <g transform="translate(200, 65)">
    <!-- Flower Emblem -->
    <g fill="#b88523">
      <circle cx="0" cy="0" r="5"/>
      <!-- Top Petal -->
      <path d="M 0 -4 C -14 -26 -10 -54 0 -60 C 10 -54 14 -26 0 -4 Z"/>
      <!-- Top Left Petal -->
      <path d="M -4 -4 C -28 -18 -54 -30 -56 -20 C -52 -10 -24 -6 -4 -4 Z"/>
      <!-- Top Right Petal -->
      <path d="M 4 -4 C 28 -18 54 -30 56 -20 C 52 -10 24 -6 4 -4 Z"/>
      <!-- Bottom Left Petal -->
      <path d="M -4 2 C -26 4 -52 18 -46 26 C -36 30 -14 14 -4 2 Z"/>
      <!-- Bottom Right Petal -->
      <path d="M 4 2 C 26 4 52 18 46 26 C 36 30 14 14 4 2 Z"/>
      <!-- Curved Stem -->
      <path d="M -3 4 Q -8 31 -12 52 Q -3 36 2 8 Z"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="200" y="145" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#385434" text-anchor="middle" letter-spacing="-0.5">Pushpangan</text>
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#4a5d46" text-anchor="middle" letter-spacing="2.2">ROOTED IN SOIL, GROWN WITH LOVE</text>
</svg>
